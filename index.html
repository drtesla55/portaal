<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
   <link rel="icon" type="image/png" sizes="32x32" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuv_hmI2DMaOB1ljgksKCD0mgTOFQ1TlGpLw&s"/>
   <meta http-equiv="refresh" content="1;url=https://mijn.mmdns.nl/nlnl>  <title>Infomedics..</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-size: cover;
      background-position: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: auto;
    }

    h1 {
      font-size: 3.5em;
      font-weight: bold;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    .loader {
      border: 6px solid #000040;
      border-top: 6px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-top: 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBHi2VfP5V3morI6ujFudriUNLDLdLXOS5bg&s" alt="Logo"><br>
  
  <h1>  <img class="logo" src="https://d1twnm33rljaon.cloudfront.net/_AUTOxAUTO_crop_center-center_none/122193/iDEAL_Wero_Lockup_Yellow_Horizontal_RGB.webp" alt="Logo"><br>
</h1>
  
  <div class="loader"></div>


</body>
</html>
